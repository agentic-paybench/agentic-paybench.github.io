name: family-check

# The served page index.html is rendered from README.md by the vendored family
# layout (family/family.py); the first check fails when the two drift apart.
# The family page gates (DES-100) then run on the page served from its own
# origin: the network-log, layout and axe-core checks, and Lighthouse CI with
# budgets. Allowed hosts: the page's own origin only.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  family-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: index.html matches a fresh render of README.md
        run: python3 -I family/family.py render --content README.md --out index.html --surface index --posture measurement --family family/ --lead-first --check
      - name: Install the gate tools (pinned)
        run: |
          cd family-gates && npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Serve the page on its own origin
        run: |
          python3 -m http.server 8080 --directory . > /tmp/http.log 2>&1 &
          sleep 1
      - name: Network-log, layout and axe-core checks
        run: node family-gates/check.mjs --base http://127.0.0.1:8080 --out family-gates-report.json --paths /
      - name: Lighthouse CI with budgets
        run: cd family-gates && npx lhci autorun --config=lighthouserc.json --collect.url=http://127.0.0.1:8080/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: family-gates
          path: |
            family-gates-report.json
            family-gates/.lighthouseci
